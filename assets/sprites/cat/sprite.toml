# Tabby cat, converted from a 1586x992 contact sheet onto an exact 8x5 grid.
#
# Frame numbering, left to right, top to bottom from 0:
#    0-7   standing / idle (a couple of blinks in there)
#    8-15  walk cycle
#   16-23  run cycle
#   24-26  sitting down: stand -> sit -> crouch
#   27-31  lying down, asleep (30 and 31 have the Zzz)
#      32  "!"           33  angry mark      34  stretched out
#      35  looking up    36  on its back     37  dizzy stars
#   38-39  sitting

image = "creature.png"
frame_width = 64
frame_height = 64

[anims.idle]
frames = [0, 1, 2, 3, 4, 5, 6, 7]
frame_ms = 200

[anims.walk]
frames = [8, 9, 10, 11, 12, 13, 14, 15]
frame_ms = 90

[anims.run]
frames = [16, 17, 18, 19, 20, 21, 22, 23]
frame_ms = 55

# Airborne — used for falling and for jumping up onto a window.
[anims.fall]
frames = [35, 36]
frame_ms = 140

[anims.sleep]
frames = [27, 28, 29, 30, 31]
frame_ms = 480

# The anger mark blinking on and off over a sitting cat.
[anims.annoyed]
frames = [33, 38]
frame_ms = 160

# While you are holding it with the mouse.
[anims.drag]
frames = [34]
frame_ms = 200

# Reminders, an app opening, or clicking the cat: startled, then pleased.
[anims.alert]
frames = [32, 37]
frame_ms = 180

[anims.sit]
frames = [38, 39]
frame_ms = 500
